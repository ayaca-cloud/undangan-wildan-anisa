<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f7f2e8'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='22' fill='%23b07a52' text-anchor='middle'%3EW%26amp%3BA%3C/text%3E%3C/svg%3E">
<title>Panitia — Wildan & Anisa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="invitation.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .panitia-wrap{max-width:640px;margin:0 auto;padding:26px 18px 70px}
  .panitia-wrap .event-card{margin-bottom:18px;text-align:left}
  .panitia-wrap .event-card.fokus{text-align:center}
  .panitia-wrap h3{margin-top:0}
</style>
</head>
<body>
<div class="panitia-wrap">
  <div class="section-head">
    <div class="eyebrow">Panitia · Wildan &amp; Anisa</div>
    <h2 class="script">Meja Penerima Tamu</h2>
    <p class="small">Tunjukkan QR ke tamu • pantau kehadiran di sini</p>
    <p class="small"><a href="index.html">← undangan</a> • <a href="tamu.html">daftar tamu →</a></p>
  </div>

  <div class="form-card" id="pinBox">
    <label for="pinInput">Masukkan PIN panitia</label>
    <input id="pinInput" inputmode="numeric" placeholder="6 digit">
    <button class="btn" id="pinBtn" style="width:100%;margin-top:16px">Masuk 🔓</button>
  </div>

  <div id="scanArea" style="display:none">
    <div class="event-card fokus">
      <div class="event-icon">🔳</div>
      <h3>QR untuk Tamu</h3>
      <p class="small">Tunjukin QR ini ke tamu → tamu scan pakai kamera HP / Google Lens → isi nama → kehadirannya langsung tercatat.</p>
      <button class="btn" id="showQrBtn">Tampilkan QR</button>
      <div id="qrTamu" style="display:none;margin-top:14px">
        <div id="qrTamuImg" style="display:flex;justify-content:center;background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line);width:max-content;margin:0 auto"></div>
        <p class="small" id="qrTamuUrl" style="word-break:break-all;margin-top:8px"></p>
        <button class="btn secondary kecil" onclick="window.print()">🖨️ Print QR</button>
      </div>
    </div>

    <div class="event-card">
      <h3>📋 Kehadiran Tamu</h3>
      <p class="small" id="syncStatus" style="margin:4px 0">⏳ memuat...</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
        <button class="btn secondary kecil" onclick="refreshDaftar()">🔄 Refresh</button>
        <button class="btn secondary kecil" id="exportBtn">⬇️ Export CSV</button>
      </div>
      <div id="daftarTamu"></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="scan.js"></script>
</body>
</html>
