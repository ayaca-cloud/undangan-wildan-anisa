<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Panitia — Wildan & Anisa</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap" style="padding-top:24px">
  <div class="doodle-card kuning center">
    <h1 class="hand" style="font-size:34px;margin:0">🎥 Scan Panitia</h1>
    <p class="kecil">Khusus penerima tamu • hubungi Wildan/Anisa untuk PIN</p>
    <p><a href="index.html">← kembali ke undangan</a> • <a href="tamu.html">daftar tamu →</a></p>
  </div>

  <div class="doodle-card" id="pinBox">
    <label>Masukkan PIN panitia</label>
    <input id="pinInput" inputmode="numeric" placeholder="6 digit">
    <button class="btn pink" id="pinBtn" style="width:100%">Masuk 🔓</button>
  </div>

  <div id="scanArea" style="display:none">
    <div class="doodle-card biru">
      <video id="video" playsinline></video>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn kecil" id="startBtn">▶️ Mulai Kamera</button>
        <button class="btn putih kecil" id="stopBtn">⏹️ Stop</button>
      </div>
      <p class="kecil">Arahkan kamera ke QR tamu. Atau ketik manual di bawah.</p>
      <label>Kode manual (cth: WDG-AB12CD)</label>
      <input id="manualKode" placeholder="WDG-....">
      <button class="btn biru kecil" id="manualBtn">Cek Manual 🔍</button>
      <div id="hasil"></div>
    </div>
    <div class="doodle-card hijau">
      <h3 class="hand" style="margin:0">📋 Daftar check-in (HP ini)</h3>
      <div id="daftarTamu"></div>
      <button class="btn biru kecil" onclick="refreshDaftar()">🔄 Refresh daftar</button>
      <button class="btn putih kecil" id="exportBtn">⬇️ Export CSV</button>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="scan.js"></script>
</body>
</html>
