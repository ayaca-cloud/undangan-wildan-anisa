<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f7f2e8'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='22' fill='%23b07a52' text-anchor='middle'%3EW%26amp%3BA%3C/text%3E%3C/svg%3E">
<title>Daftar Tamu — Wildan & Anisa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="invitation.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .tamu-wrap{max-width:760px;margin:0 auto;padding:26px 18px 70px}
  .tamu-wrap .event-card{margin-bottom:18px}
  .tamu-wrap h3{margin-top:0}
</style>
</head>
<body>
<div class="tamu-wrap">
  <div class="section-head">
    <div class="eyebrow">Panitia · Wildan &amp; Anisa</div>
    <h2 class="script">Daftar Tamu</h2>
    <p class="small">Ketik nama → jadi link personal + pesan WA siap kirim</p>
    <p class="small"><a href="index.html">← undangan</a> • <a href="scan.html">panitia (QR) →</a></p>
  </div>

  <div class="form-card" id="pinBox">
    <label for="pinInput">Masukkan PIN panitia</label>
    <input id="pinInput" inputmode="numeric" placeholder="6 digit">
    <button class="btn" id="pinBtn" style="width:100%;margin-top:16px">Masuk 🔓</button>
  </div>

  <div id="tamuArea" style="display:none">
    <div class="event-card">
      <h3>➕ Tambah Tamu</h3>
      <label for="baseUrl">Link dasar undangan (ganti kalau beda)</label>
      <input id="baseUrl" placeholder="https://wedding-invitation.blog">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label for="fNama">Nama tamu</label><input id="fNama" placeholder="cth: Bpk. Budi Santoso"></div>
        <div><label for="fWa">No. WA (opsional)</label><input id="fWa" inputmode="tel" placeholder="cth: 0812xxxx"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label for="fKat">Kategori</label>
          <select id="fKat"><option>Keluarga</option><option>Saudara</option><option>Teman</option><option>Kerja</option><option>Lainnya</option></select>
        </div>
        <div><label for="fPax">Pax</label><input id="fPax" type="number" min="1" max="10" value="2"></div>
      </div>
      <button class="btn" id="addBtn" style="width:100%;margin-top:16px">➕ Tambah Tamu</button>
      <p class="small">Tips: tulis gelar (Bpk./Ibu) sekalian biar link-nya sopan.</p>
    </div>

    <div class="event-card">
      <h3>💬 Template pesan WA</h3>
      <p class="small">Pakai {nama} dan {link} — otomatis diganti per tamu.</p>
      <textarea id="tplPesan" rows="9"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn secondary kecil" id="tplReset">↩️ Template awal</button>
        <button class="btn secondary kecil" id="tplSimpan">💾 Simpan template</button>
      </div>
    </div>

    <div class="event-card">
      <h3>📇 <span id="totalTamu">0</span> tamu <span class="small" id="statRsvp"></span></h3>
      <p class="small" id="syncStatus" style="margin:4px 0">⏳ memuat...</p>
      <div style="display:flex;gap:8px;margin:8px 0;flex-wrap:wrap">
        <button class="btn secondary kecil" id="refreshBtn">🔄 Cek RSVP + Sync</button>
        <button class="btn secondary kecil" id="exportBtn">⬇️ Export CSV</button>
      </div>
      <div id="daftarTamu"></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="tamu.js"></script>
</body>
</html>
